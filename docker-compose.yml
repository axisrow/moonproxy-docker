services:
  moonbridge:
    build: .
    image: moonbridge-zai-proxy:local
    container_name: moonbridge-zai-proxy
    restart: unless-stopped
    command: ["-config", "/config/config.yml", "-addr", "0.0.0.0:38440"]
    ports:
      # Intentional for the requested test setup: this has no client auth.
      - "38440:38440"
    volumes:
      - ./config/config.yml:/config/config.yml:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./trace:/app/trace
    healthcheck:
      test: ["CMD", "/app/moonbridge", "-config", "/config/config.yml", "-print-addr"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
